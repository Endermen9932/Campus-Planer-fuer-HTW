name: campus_planer
description: Campus-Planer – inoffizielle Stundenplan-App (LSF) – Android, iOS, Windows, macOS, Linux.
publish_to: none
version: 0.1.0+2
authors:
  - Julian Gippner <endermen9932@users.noreply.github.com>

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

  # Lokale Datenschicht (Login, Scraping, iCal-Parsing) – siehe ../packages/lsf_client
  lsf_client:
    path: ../packages/lsf_client

  # Zugangsdaten verschlüsselt auf dem Gerät (Keychain/Keystore/libsecret/DPAPI)
  flutter_secure_storage: ^9.2.2
  # Periodischer Hintergrund-Refresh (Android WorkManager / iOS BGTaskScheduler)
  workmanager: ^0.9.0
  # Lokale Benachrichtigungen bei Stundenplan-Änderungen
  flutter_local_notifications: ^17.2.3
  # Kleiner Key/Value-Speicher für Cache-Hashes
  shared_preferences: ^2.3.2
  # Datumsformatierung
  intl: ^0.19.0
  # HTML-Parsing für den Mensa-Speiseplan
  html: ^0.15.4
  # Material-You Dynamic Color (Wallpaper-Extraktion auf Android 12+, gibt null sonst)
  dynamic_color: ^1.7.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
