name: Build .deb nur

# Schneller .deb Build für Linux - kann manuell ausgelöst werden via workflow_dispatch

on:
  workflow_dispatch:

env:
  FLUTTER_CHANNEL: stable
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  linux:
    name: Linux .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native Abhängigkeiten
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter config --enable-linux-desktop
      - name: Plattform-Ordner erzeugen
        run: flutter create --platforms=linux .
        working-directory: app
      - run: flutter pub get
        working-directory: app
      - run: flutter build linux --release
        working-directory: app
      - name: .deb paketieren
        run: bash packaging/linux/build_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: htw-center-deb
          path: build/deb/*.deb
          if-no-files-found: error
