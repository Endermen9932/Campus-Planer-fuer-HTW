name: PR-Builds (APK · .deb · Windows)

# Baut bei jedem Pull Request herunterladbare Test-Artefakte:
#   - Android  -> app-release.apk
#   - Linux    -> htw-center_*.deb
#   - Windows  -> Release-Ordner (htw_center.exe + DLLs + data/)
#
# Hinweis: Die nativen Plattform-Ordner sind (noch) nicht eingecheckt; der
# Workflow erzeugt sie per `flutter create`. Sobald du sie lokal mit
# `cd app && flutter create .` erzeugst und committest, kannst du die
# "Plattform-Ordner erzeugen"- und Desugaring-Schritte entfernen.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Plattform-Ordner erzeugen
        run: flutter create --platforms=android .
        working-directory: app
      - name: Keystore einrichten (falls Secrets vorhanden)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/android/app/keystore.jks
            cat > app/android/key.properties << EOF
          storeFile=../app/keystore.jks
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          EOF
            echo "Release-Signing eingerichtet."
          else
            echo "Keine Signing-Secrets vorhanden – baue mit Debug-Signing."
          fi
      - name: Android-Build konfigurieren (Desugaring + R8 + WorkManager-Keep-Regel)
        run: bash tools/ci/enable_android_desugaring.sh app/android
      - run: flutter pub get
        working-directory: app
      - run: flutter build apk --release
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: htw-center-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3
          if-no-files-found: error

  linux:
    name: Linux .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native Abhängigkeiten
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: flutter config --enable-linux-desktop
      - name: Plattform-Ordner erzeugen
        run: flutter create --platforms=linux .
        working-directory: app
      - run: flutter pub get
        working-directory: app
      - run: flutter build linux --release
        working-directory: app
      - name: .deb paketieren
        run: bash packaging/linux/build_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: htw-center-deb
          path: build/deb/*.deb
          retention-days: 3
          if-no-files-found: error

  windows:
    name: Windows (.exe + DLLs)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Plattform-Ordner erzeugen
        run: flutter create --platforms=windows .
        working-directory: app
      - run: flutter pub get
        working-directory: app
      - run: flutter build windows --release
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: htw-center-windows
          path: app/build/windows/x64/runner/Release/
          retention-days: 3
          if-no-files-found: error
