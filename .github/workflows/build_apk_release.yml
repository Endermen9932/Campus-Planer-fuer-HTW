name: Build APK Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FLUTTER_CHANNEL: stable
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Release APK Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore app/android/app/keystore.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ secrets.MY_SECRET }}" \
            -keypass "${{ secrets.MY_SECRET }}" \
            -dname "CN=Unknown, OU=Unknown, O=Unknown, L=Unknown, ST=Unknown, C=Unknown"

      - name: Generate key.properties
        run: |
          cat > app/android/key.properties << EOF
          storeFile=../app/keystore.jks
          storePassword=${{ secrets.MY_SECRET }}
          keyPassword=${{ secrets.MY_SECRET }}
          keyAlias=upload
          EOF

      - name: Configure Android build (Desugaring + R8)
        run: bash tools/ci/enable_android_desugaring.sh app/android

      - name: Get Flutter dependencies
        run: cd app && flutter pub get

      - name: Build Release APK
        run: cd app && flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
