name: Build APK Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FLUTTER_CHANNEL: stable
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Release APK Build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Configure Android build (Desugaring + R8)
        run: bash tools/ci/enable_android_desugaring.sh app/android

      - name: Get Flutter dependencies
        run: cd app && flutter pub get

      - name: Build Release APK (debug-signed)
        run: cd app && flutter build apk --release

      - name: Read version from pubspec
        id: version
        run: |
          VERSION=$(grep '^version:' app/pubspec.yaml | sed 's/version: //')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-debug
          name: "v${{ steps.version.outputs.version }} (Debug-Key)"
          body: |
            Automatisch gebaute APK, signiert mit dem **Android Debug Key**.

            Diese APK ist zum direkten Testen geeignet.
          files: app/build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
