name: Build (alle Plattformen)

# Baut die App für alle fünf Zielplattformen. Wird manuell oder per Tag
# ausgelöst. Voraussetzung: die nativen Plattform-Ordner existieren (einmalig
# `cd app && flutter create .` ausführen und committen) – siehe README.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  FLUTTER_CHANNEL: stable

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: flutter pub get
        working-directory: app
      - run: flutter build apk --release
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: htw-center-android
          path: app/build/app/outputs/flutter-apk/*.apk

  linux:
    name: Linux (.deb via Bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
        working-directory: app
      - run: flutter build linux --release
        working-directory: app
      # Aus dem Bundle ein .deb bauen: z.B. via `flutter_to_debian` oder eigenem
      # control-File. Hier wird zunächst das Bundle als Artefakt hochgeladen.
      - uses: actions/upload-artifact@v4
        with:
          name: htw-center-linux-bundle
          path: app/build/linux/x64/release/bundle/

  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: flutter pub get
        working-directory: app
      - run: flutter build windows --release
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: htw-center-windows
          path: app/build/windows/x64/runner/Release/

  macos:
    name: macOS (.app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: flutter pub get
        working-directory: app
      - run: flutter build macos --release
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: htw-center-macos
          path: app/build/macos/Build/Products/Release/*.app

  ios:
    name: iOS (.app, unsigniert)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: flutter pub get
        working-directory: app
      # Ohne Signierung; für TestFlight/App Store werden Apple-Zertifikate +
      # Provisioning-Profile benötigt (Apple Developer Account, 99 $/Jahr).
      - run: flutter build ios --release --no-codesign
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: htw-center-ios-unsigned
          path: app/build/ios/iphoneos/Runner.app
