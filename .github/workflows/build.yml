name: Build (alle Plattformen)

# Baut die App für alle fünf Zielplattformen (Release). Wird manuell oder per
# Tag ausgelöst. Plattform-Ordner werden – falls nicht eingecheckt – per
# `flutter create` erzeugt. Für herunterladbare PR-Test-Builds siehe pr-build.yml.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  FLUTTER_CHANNEL: stable
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Plattform-Ordner erzeugen
        run: flutter create --platforms=android .
        working-directory: app
      - name: Keystore einrichten
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/android/app/keystore.jks
          cat > app/android/key.properties << EOF
          storeFile=../app/keystore.jks
          storePassword=${{ secrets.MY_SECRET }}
          keyPassword=${{ secrets.MY_SECRET }}
          keyAlias=upload
          EOF
      - name: Android-Build konfigurieren (Desugaring + R8 + WorkManager-Keep-Regel)
        run: bash tools/ci/enable_android_desugaring.sh app/android
      - run: flutter pub get
        working-directory: app
      - run: flutter build apk --release
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: htw-center-android
          path: app/build/app/outputs/flutter-apk/*.apk

  linux:
    name: Linux (.deb via Bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: flutter config --enable-linux-desktop
      - name: Plattform-Ordner erzeugen
        run: flutter create --platforms=linux .
        working-directory: app
      - run: flutter pub get
        working-directory: app
      - run: flutter build linux --release
        working-directory: app
      - name: Paketieren als .deb
        run: bash packaging/linux/build_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: htw-center-linux-deb
          path: build/deb/*.deb

  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Plattform-Ordner erzeugen
        run: flutter create --platforms=windows .
        working-directory: app
      - run: flutter pub get
        working-directory: app
      - run: flutter build windows --release
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: htw-center-windows
          path: app/build/windows/x64/runner/Release/

  macos:
    name: macOS (.app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Plattform-Ordner erzeugen
        run: flutter create --platforms=macos .
        working-directory: app
      - run: flutter pub get
        working-directory: app
      - run: flutter build macos --release
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: htw-center-macos
          path: app/build/macos/Build/Products/Release/*.app

  ios:
    name: iOS (.app, unsigniert)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Plattform-Ordner erzeugen
        run: flutter create --platforms=ios .
        working-directory: app
      - run: flutter pub get
        working-directory: app
      # Ohne Signierung; für TestFlight/App Store werden Apple-Zertifikate +
      # Provisioning-Profile benötigt (Apple Developer Account, 99 $/Jahr).
      - run: flutter build ios --release --no-codesign
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: htw-center-ios-unsigned
          path: app/build/ios/iphoneos/Runner.app
