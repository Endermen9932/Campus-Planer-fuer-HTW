name: Build AAB for Play Store

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2

      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore android/app/keystore.jks \
            -keyalias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ secrets.MY_SECRET }}" \
            -keypass "${{ secrets.MY_SECRET }}" \
            -dname "CN=Unknown, OU=Unknown, O=Unknown, L=Unknown, ST=Unknown, C=Unknown"

      - name: Generate key.properties
        run: |
          cat > android/key.properties << EOF
          storeFile=../app/keystore.jks
          storePassword=${{ secrets.MY_SECRET }}
          keyPassword=${{ secrets.MY_SECRET }}
          keyAlias=upload
          EOF

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Create and encrypt secure package
        run: |
          mkdir -p temp-secure
          cp build/app/outputs/bundle/release/app-release.aab temp-secure/
          cp android/app/keystore.jks temp-secure/
          cd temp-secure
          zip -P "${{ secrets.MY_SECRET }}" ../Secure-Release-Package.zip app-release.aab keystore.jks
          cd ..
          rm -rf temp-secure

      - name: Upload secure artifact
        uses: actions/upload-artifact@v4
        with:
          name: Secure-Release-Package
          path: Secure-Release-Package.zip
          retention-days: 7
