name: Deploy Web (PWA)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # peaceiris/actions-gh-pages braucht Schreibzugriff

env:
  FLUTTER_CHANNEL: stable
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}

      # Ergänzt fehlende generierte Web-Dateien (icons/, flutter_bootstrap.js, …)
      # ohne unsere committeten index.html / manifest.json zu überschreiben.
      - name: Web-Plattform-Ordner ergänzen
        run: flutter create --platforms=web .
        working-directory: app

      - name: Flutter pub get
        run: flutter pub get
        working-directory: app

      - name: Build web (release)
        run: >-
          flutter build web --release
          --base-href "/Campus-Planer-fuer-HTW/"
          --dart-define=PROXY_BASE=${{ vars.PROXY_BASE }}
        working-directory: app

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app/build/web
